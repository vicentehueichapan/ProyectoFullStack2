<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="Carrito de compra demostrativo de Gas El Volcán." name="description">
    <title>Carrito | Gas El Volcán</title>
    <link href="css/style.css" rel="stylesheet">
    <script defer src="js/site.js">
    </script>
    <script defer src="js/datos/productos.js">
    </script>
    <script defer src="js/carrito.js">
    </script>
    <script defer src="js/carrito-vista.js">
    </script>
  </head>
  <body>
    <a class="skip-link" href="#contenido">
      Saltar al contenido
    </a>
    <header data-active="carrito" data-site-header="">
    </header>
    <main class="page-main" id="contenido">
      <header class="container page-heading">
        <p class="eyebrow">Compra demostrativa</p>
        <h1>Mi carrito</h1>
        <p>Las cantidades se conservan en este navegador mediante localStorage. No se procesan pagos ni pedidos reales.</p>
      </header>
      <section class="section">
        <div class="container">
          <p aria-live="polite" class="form-status" data-cart-status="" tabindex="-1">
          </p>
          <div class="cart-layout">
            <div class="cart-list" data-cart-list="">
            </div>
            <aside aria-label="Resumen del carrito" class="cart-summary" data-cart-summary="">
            </aside>
          </div>
        </div>
      </section>
    </main>
    <footer data-site-footer="">
    </footer>
  </body>
</html>
